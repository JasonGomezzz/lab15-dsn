AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Docker y aplicación web (nginxdemos/hello) desplegada automáticamente

Parameters:
  # El enunciado usa t2.micro, pero esta cuenta (plan Free Tier nuevo) lo rechaza
  # con "instance type is not eligible for Free Tier". t3.micro sí es elegible.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]
    Description: Tipo de instancia EC2

  # AMI vigente de Amazon Linux 2023, resuelta por SSM en la región del stack.
  # El enunciado fija un AMI de Amazon Linux 2 de una sola región (ami-0c02fb...).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir acceso HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SecurityGroupIds:
        - !GetAtt WebSecurityGroup.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y docker

          systemctl start docker
          systemctl enable docker

          docker run -d --name web --restart unless-stopped -p 80:80 nginxdemos/hello

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref WebServer

  PublicIP:
    Description: IP Pública
    Value: !GetAtt WebServer.PublicIp

  WebURL:
    Description: URL de la aplicación
    Value: !Sub http://${WebServer.PublicIp}
