AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Docker, etiquetas, Key Pair y aplicación parametrizable que se redespliega al actualizar el stack

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]
    Description: Tipo de instancia EC2 (t2.micro no es Free Tier en cuentas nuevas)

  # Desafío nivel 2: Key Pair como parámetro
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key Pair existente para conectarse por SSH

  # El enunciado abre el 22 a 0.0.0.0/0; aquí se obliga a elegir un CIDR.
  SshCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Use un CIDR, por ejemplo 203.0.113.10/32
    Description: Rango desde el que se permite SSH (use su IP publica con /32)

  # Desafío nivel 3: aplicación desde Docker Hub
  AppImage:
    Type: String
    Default: nginxdemos/hello
    AllowedValues: [nginx, nginxdemos/hello, httpd]
    Description: Imagen de Docker Hub que se ejecuta en el puerto 80

Resources:

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir HTTP publico y SSH restringido
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Laboratorio-Docker

  # cfn-init y cfn-hup necesitan leer los metadatos de este stack (mínimo privilegio).
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: leer-metadatos-del-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStackResource
                Resource: !Ref AWS::StackId

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  WebServer:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/cfn/cfn-hup.conf:
              mode: '000400'
              owner: root
              group: root
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
                interval=1
            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              mode: '000400'
              owner: root
              group: root
              content: !Sub |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.WebServer.Metadata.AWS::CloudFormation::Init
                action=/opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}
                runas=root
            /etc/systemd/system/cfn-hup.service:
              mode: '000644'
              owner: root
              group: root
              content: |
                [Unit]
                Description=cfn-hup: detecta cambios de metadatos del stack
                After=network-online.target
                [Service]
                Type=simple
                ExecStart=/opt/aws/bin/cfn-hup
                Restart=always
                [Install]
                WantedBy=multi-user.target
            # La imagen vive aquí: al cambiar AppImage cambian los metadatos y cfn-hup relanza el contenedor.
            /usr/local/bin/deploy-app.sh:
              mode: '000755'
              owner: root
              group: root
              content: !Sub |
                #!/bin/bash
                set -e
                docker rm -f web 2>/dev/null || true
                docker run -d --name web --restart unless-stopped -p 80:80 ${AppImage}
          commands:
            00_recargar_systemd:
              command: systemctl daemon-reload
            01_desplegar_app:
              command: /usr/local/bin/deploy-app.sh
          services:
            systemd:
              docker:
                enabled: true
                ensureRunning: true
              cfn-hup:
                enabled: true
                ensureRunning: true
                files:
                  - /etc/cfn/cfn-hup.conf
                  - /etc/cfn/hooks.d/cfn-auto-reloader.conf
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt WebSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: Laboratorio-Docker
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -x
          dnf install -y docker aws-cfn-bootstrap
          systemctl enable --now docker
          /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}

  # IP fija: no cambia cuando CloudFormation detiene/inicia la instancia al actualizar.
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref WebServer
      Tags:
        - Key: Name
          Value: Laboratorio-Docker

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref WebServer

  PublicIP:
    Description: IP Pública (Elastic IP)
    Value: !Ref ElasticIP

  WebURL:
    Description: URL de la aplicación
    Value: !Sub http://${ElasticIP}

  SshCommand:
    Description: Comando para conectarse por SSH
    Value: !Sub ssh -i ${KeyName}.pem ec2-user@${ElasticIP}
